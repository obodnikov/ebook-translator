# Default configuration for btrans.
#
# Uses OpenRouter for all stages (universally runnable default).
# Copy this file to your project directory as configs/default.yaml and
# adjust as needed.
#
# For kiro-gateway routing, see configs/kiro-gateway.yaml.example.

source_lang: en
target_lang: ru
# target_lang_name: Russian  # auto-derived from target_lang if omitted

providers:
  text:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  image:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

chunker:
  target_words: 2000
  overlap_paragraphs: 1

translate:
  parallelism: 1

# Model names must match your provider's format.
# For OpenRouter use the anthropic/ prefix (anthropic/claude-sonnet-4.6).
models:
  glossary:   anthropic/claude-sonnet-4.6
  translate:  anthropic/claude-sonnet-4.6
  judge:      anthropic/claude-haiku-4.5
  reflect:    anthropic/claude-sonnet-4.6
  proofread:  anthropic/claude-haiku-4.5
  style:      anthropic/claude-sonnet-4.6
  verify:     anthropic/claude-sonnet-4.6

reflection:
  trigger_score: 3

pauses:
  after_glossary: true
  after_translate: true

stages:
  proofread: true
  style: true
  verify: true

retry:
  max_attempts: 5
  backoff_base: 2.0

notifications:
  enabled: true
  provider: telegram

cost:
  hard_limit_usd: 50.0

reader_notes:
  enabled: false
  types: [concept, term]
  scope: first-in-book
